version: '3.9'

services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest

    container_name: sqlserver

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong@Pass123"

    ports:
      - "1433:1433"

    volumes:
      - sql_data:/var/opt/mssql

  api:

    build:
      context: .
      dockerfile: src/PurchaseTransaction.Api/Dockerfile

    container_name: purchase-api

    depends_on:
      - sqlserver

    environment:

      ASPNETCORE_ENVIRONMENT: Docker

      ConnectionStrings__DefaultConnection: >
        Server=sqlserver;
        Database=PurchaseTransaction;
        User Id=sa;
        Password=YourStrong@Pass123;
        TrustServerCertificate=True;

    ports:
      - "5000:8080"

volumes:

  sql_data: